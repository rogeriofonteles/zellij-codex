[package]
name = "zellij-codex"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[[bin]]
name = "zellij-codex-tab-bar"
path = "src/tab_bar/main.rs"

[dependencies]
ansi_term = "0.12"
unicode-width = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellij-tile = "=0.44.3"
